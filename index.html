<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F3EA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Denkpause</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Denkpause">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Figtree:wght@500;600;700&family=JetBrains+Mono:wght@700;800&display=swap">
<style>
/* Layout: one-column phone app on eggshell; white tiles, one bright colour per game, heavy type. Deliberately light-only. */
:root{
  color-scheme:light;
  --bg:#F7F3EA; --surface:#FFFFFF; --ink:#141414; --muted:#6E6A62; --line:#E7E1D4;
  --geo:#2F6BFF; --wissen:#8A4DFF; --fermi:#FF7A1A; --rechnen:#11A866; --sudoku:#FF3D7F;
  --reward:#FFC21A; --good:#11A866; --bad:#E5483B;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:"Figtree", -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
.app{max-width:440px;margin:0 auto;padding-block:20px 32px;display:flex;flex-direction:column;gap:16px;min-height:100%;box-sizing:border-box}
h1,h2{font-family:var(--display);font-weight:900;margin:0;text-wrap:balance;letter-spacing:-.025em;line-height:1}
.eyebrow{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:-.035em}
.brand svg{flex:none}
.dots{display:inline-flex;gap:3px;margin-left:1px}
.dots i{width:7px;height:7px;border-radius:50%}
.chips{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:13px;font-weight:800;background:var(--surface);border-radius:999px;padding:6px 11px}
.hello h1{font-size:40px}
.hello p{margin:10px 0 0;color:var(--muted);font-size:17px}
.name-btn{all:unset;cursor:pointer;border-bottom:3px solid var(--reward)}
.card{background:var(--surface);border-radius:20px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.games{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--display);font-weight:800;font-size:13px;padding:6px 10px;border-radius:999px;color:#fff}
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font-family:var(--display);font-weight:900;font-size:18px;padding:16px 18px;border-radius:16px;background:var(--ink);color:#fff;width:100%;letter-spacing:-.01em}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.gold{background:var(--reward);color:var(--ink)}
.btn:focus-visible,.opt:focus-visible,.cell:focus-visible,.pad button:focus-visible,.name-btn:focus-visible,input:focus-visible{outline:3px solid var(--geo);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--reward);border-radius:99px;transition:width .6s ease}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:14px 12px}
.stat .n{font-family:var(--display);font-size:28px;font-weight:900;line-height:1}
.stat .l{color:var(--muted);font-size:12px;margin-top:5px;font-weight:600}
.streak3{display:flex;gap:6px}
.streak3 span{flex:1;height:8px;border-radius:9px;background:var(--line)}
.streak3 span.on{background:var(--reward)}
.bonus{background:var(--ink);color:#fff}
.bonus .eyebrow{color:var(--reward)}
.bonus h2{font-size:26px}
/* intro */
.intro{justify-content:space-between}
.intro h1{font-size:46px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs .card{padding:16px 14px;display:flex;flex-direction:column;gap:8px}
.vs .big{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.vs .scroll{background:transparent;box-shadow:inset 0 0 0 2px var(--line);color:var(--muted)}
.vs .scroll .big{color:var(--muted)}
.vs ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.quote{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;letter-spacing:-.015em;text-wrap:balance}
.quote small{display:block;margin-top:8px;font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
/* game */
.progress{display:flex;gap:5px}
.gamebar{display:flex;align-items:center;gap:12px}
.gamebar .progress{flex:1}
.x{all:unset;cursor:pointer;font-family:var(--display);font-weight:800;font-size:13px;padding:8px 12px;border-radius:999px;background:var(--surface);color:var(--muted);white-space:nowrap}
.x.arm{background:var(--bad);color:#fff}
.x:focus-visible{outline:3px solid var(--geo);outline-offset:2px}
.has-tabs{padding-bottom:104px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs button{all:unset;cursor:pointer;flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-family:var(--display);font-weight:800;font-size:11px;border-radius:12px}
.tabs button.on{color:var(--ink)}
.tabs button.on svg{stroke:var(--geo)}
.tabs button:focus-visible{outline:3px solid var(--geo);outline-offset:-2px}
.mini{all:unset;cursor:pointer;box-sizing:border-box;padding:10px 14px;border-radius:12px;background:var(--ink);color:#fff;font-family:var(--display);font-weight:800;font-size:14px;white-space:nowrap}
.mini.danger,.btn.danger{background:var(--bad);color:#fff;box-shadow:none}
.mini:focus-visible{outline:3px solid var(--geo);outline-offset:2px}
.codebox{display:flex;gap:8px;align-items:center}
.codebox input{flex:1;min-width:0;font:inherit;font-family:var(--mono);font-size:13px;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);padding:5px;border-radius:14px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:11px 0;border-radius:10px;font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.seg button:focus-visible{outline:3px solid var(--geo);outline-offset:2px}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--bg)}
.rank li.me{background:#FFF3CC}
.rank .pos{font-family:var(--display);font-weight:900;font-size:18px;width:20px}
.rank .who{flex:1;min-width:0;font-weight:700}
.rank .who small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.rank .xp{font-family:var(--mono);font-weight:800;font-size:14px;white-space:nowrap}
.sub{display:block;margin-top:10px;font-family:var(--body);font-size:16px;font-weight:600;color:var(--muted);letter-spacing:0}
.chip.info{all:unset;box-sizing:border-box;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--surface);font-family:var(--display);font-weight:900;font-size:15px}
.chip.info:focus-visible{outline:3px solid var(--geo);outline-offset:2px}
.flag{display:block;font-size:92px;line-height:1;margin-bottom:14px}
.progress span{flex:1;height:5px;border-radius:9px;background:var(--line)}
.gamehead{display:flex;align-items:center;gap:8px}
.q{font-family:var(--display);font-size:28px;font-weight:900;line-height:1.08;letter-spacing:-.02em}
.opts{display:grid;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:2px solid transparent;border-radius:16px;padding:16px;font-weight:700;font-size:17px}
.opt.right{border-color:var(--good);background:#E7F7EF}
.opt.wrong{border-color:var(--bad);background:#FDEAE8}
.fact{background:var(--surface);border-radius:16px;padding:16px;font-size:15px;border-left:5px solid var(--c)}
.fact b{font-family:var(--display);font-weight:900}
.math{font-family:var(--mono);font-size:46px;font-weight:800;text-align:center;padding:10px 0;font-variant-numeric:tabular-nums}
.timer{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--rechnen);width:100%}
.mopts{grid-template-columns:repeat(2,1fr)}
.mopts .opt{text-align:center;font-family:var(--mono);font-size:24px;font-weight:800}
.fermi-in{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:6px 16px}
.fermi-in input{all:unset;flex:1;min-width:0;font-family:var(--mono);font-weight:800;font-size:30px;padding:10px 0}
.fermi-in span{font-weight:700;color:var(--muted)}
.meter{display:flex;flex-direction:column;gap:6px}
.sudoku{display:grid;grid-template-columns:repeat(4,1fr);border:3px solid var(--ink);border-radius:14px;overflow:hidden;aspect-ratio:1;max-width:100%}
.cell{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:30px;font-weight:800;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer}
.cell:nth-child(4n){border-right:none}.cell:nth-child(n+13){border-bottom:none}
.cell:nth-child(4n+2){border-right:3px solid var(--ink)}
.cell:nth-child(n+5):nth-child(-n+8){border-bottom:3px solid var(--ink)}
.cell.given{cursor:default;background:#F3EFE6}
.cell.user{color:var(--sudoku)}
.cell.sel{background:#FFE4EE}
.cell.err{color:var(--bad);text-decoration:line-through}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pad button{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:15px 0;border-radius:14px;background:var(--surface);font-family:var(--mono);font-size:22px;font-weight:800}
.xp-big{font-family:var(--display);font-size:64px;font-weight:900;line-height:1;letter-spacing:-.03em}
.learned{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.learned li{display:flex;gap:10px;font-size:15px;font-weight:600}
.learned li i{flex:none;width:9px;height:9px;margin-top:6px;border-radius:50%}
.dialog input{font:inherit;font-weight:700;font-size:18px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:translateY(6px);opacity:.4}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.bar i{transition:none}}
</style>
</head>
<body>

<main class="app" id="app"></main>
<nav class="tabs" id="tabs" hidden aria-label="Bereiche">
  <button data-tab="spiele"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span>Spiele</span></button>
  <button data-tab="freunde"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .2 5 2.3 5 5.3"/></svg><span>Freunde</span></button>
  <button data-tab="einstellungen"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Einstellungen</span></button>
</nav>

<script src="questions.js"></script>
<script>
/* ---------- Inhalte ---------- */
const GAMES={
  geo:{name:"Geo-Quiz",c:"var(--geo)",hex:"#2F6BFF"},
  wissen:{name:"Wissen",c:"var(--wissen)",hex:"#8A4DFF"},
  fermi:{name:"Schätzen",c:"var(--fermi)",hex:"#FF7A1A"},
  rechnen:{name:"Kopfrechnen",c:"var(--rechnen)",hex:"#11A866"},
  sudoku:{name:"Sudoku",c:"var(--sudoku)",hex:"#FF3D7F"}
};
const ORDER=["geo","wissen","fermi","rechnen","sudoku"];
const ICON=(n)=>`<svg aria-hidden="true" width="${n}" height="${n}" viewBox="0 0 100 100"><rect width="100" height="100" rx="23" fill="#141414"/><rect x="32" y="38" width="12" height="40" rx="6" fill="#F7F3EA"/><rect x="56" y="38" width="12" height="40" rx="6" fill="#F7F3EA"/><circle cx="50" cy="22" r="7.5" fill="#FFC21A"/></svg>`;
const BRAND=`<div class="brand">${ICON(30)}<span>denkpause<span style="color:var(--reward)">.</span></span></div>`;
const {GEO,WISSEN,FERMI,QUOTES,CLUES}=window.DP;
const EASY=new Set(["Deutschland","Frankreich","Italien","Spanien","Portugal","Niederlande","Belgien","Schweiz","Österreich","Polen","Tschechien","Ungarn","Kroatien","Griechenland","Schweden","Norwegen","Dänemark","Finnland","Island","Irland","Vereinigtes Königreich","Russland","Ukraine","Türkei","China","Japan","Südkorea","Indien","Thailand","Vietnam","Iran","Saudi-Arabien","Vereinigte Arabische Emirate","Singapur","Ägypten","Marokko","Südafrika","Kenia","Nigeria","USA","Kanada","Mexiko","Kuba","Brasilien","Argentinien","Chile","Peru","Kolumbien","Australien","Neuseeland"]);
const LEVELS={
  leicht:{label:"Leicht",desc:"Bekannte Länder, 3 statt 4 Antworten, einfachere Rechenaufgaben, mehr Zeit.",opts:3,t:10000,holes:7,fermi:[1.25,2,4]},
  mittel:{label:"Mittel",desc:"Alle Länder und Fragen, 4 Antworten, 8 Sekunden pro Rechenaufgabe.",opts:4,t:8000,holes:9,fermi:[1.1,1.5,3]},
  schwer:{label:"Schwer",desc:"Vor allem unbekanntere Länder, größere Zahlen, 6 Sekunden, strengere Schätzungen.",opts:4,t:6000,holes:11,fermi:[1.05,1.25,2]}};
const LV=()=>LEVELS[S.level]||LEVELS.mittel;

/* ---------- Zustand ---------- */
const KEY="statt.v2";
const ds=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>ds(new Date());
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return ds(d)};
function load(){
  try{const v=JSON.parse(localStorage.getItem(KEY));if(v)return v}catch(e){}
  try{const o=JSON.parse(localStorage.getItem("statt.v1"));if(o&&!o.example)return{name:o.name,xp:o.xp,streak:o.streak,last:o.last,learned:o.learned||[],rounds:o.rounds||0,facts:(o.rounds||0)*4,bonusDay:null,bonusDone:null}}catch(e){}
  return null;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
// Beispielstand für den ersten Start (deutlich als Beispiel markiert)
let S=load()||{name:"Moritz",xp:340,streak:2,last:yesterday(),learned:["Kanada","Brasilien","Schweiz","Island","Peru","Norwegen"],rounds:4,facts:22,bonusDay:null,bonusDone:null,example:true};

/* ---------- Helfer ---------- */
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
const shuffle=(a,r)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const levelOf=xp=>{let lvl=1,need=100,rest=xp;while(rest>=need){rest-=need;lvl++;need=Math.round(need*1.25)}return{lvl,rest,need}};
const greet=()=>{const h=new Date().getHours();return h<11?"Guten Morgen":h<17?"Hallo":h<22?"Guten Abend":"Noch wach"};
const fmt=n=>Number(n).toLocaleString("de-DE");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const doneToday=()=>S.last===today();
const liveStreak=()=>(S.last===today()||S.last===yesterday())?S.streak:0;
const bonusOpen=()=>S.bonusDay===today()&&S.bonusDone!==today();
const $=s=>document.querySelector(s);
const app=$("#app");
let R=null,tmr=null;
const tag=k=>`<span class="tag" style="background:${GAMES[k].c}">${GAMES[k].name}</span>`;

/* ---------- Startbildschirm ---------- */
function intro(){
  const q=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  app.className="app intro";setTabs(null);
  app.innerHTML=`
  <div class="top">${BRAND}<span class="eyebrow">3 Minuten</span></div>
  <h1 class="pop">Gleiche drei Minuten.<br>Andere Bilanz.</h1>
  <div class="vs pop">
    <div class="card scroll"><span class="eyebrow">Scrollen</span><div class="big" id="cR">0</div><ul><li>Reels gesehen</li><li>davon gemerkt: kaum etwas</li></ul></div>
    <div class="card"><span class="eyebrow" style="color:var(--rechnen)">Denkpause</span><div class="big" id="cS">0</div><ul><li>Dinge gelernt</li><li>Kopf wach, Streak sicher</li></ul></div>
  </div>
  <div class="quote pop">„${q[0]}“${q[1]?`<small>${q[1]}</small>`:""}</div>
  <button class="btn" id="in">${esc(S.name)}, los geht’s</button>`;
  const end={cR:10,cS:13};const t0=performance.now();
  const step=now=>{const p=Math.min(1,(now-t0)/900);for(const id in end){const el=document.getElementById(id);if(el)el.textContent=Math.round(end[id]*p)}if(p<1)requestAnimationFrame(step)};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){$("#cR").textContent=10;$("#cS").textContent=13}else requestAnimationFrame(step);
  $("#in").onclick=home;
}

/* ---------- Startseite ---------- */
function home(){
  app.className="app has-tabs";setTabs("spiele");
  const L=levelOf(S.xp),done=doneToday(),st=liveStreak();
  const cycle=done?(st%3===0?3:st%3):st%3;
  const bLabel=bonusOpen()?"bereit":(done&&st%3===0)?"heute geholt":`noch ${3-cycle} ${3-cycle===1?"Tag":"Tage"}`;
  app.innerHTML=`
  <div class="top">${BRAND}
   <div class="chips"><div class="chip">🔥 ${st}</div><div class="chip">Lv ${L.lvl}</div><button class="chip info" id="info" aria-label="So funktionieren die Spiele">i</button></div></div>
  <section class="hello">
   <h1>${greet()},<br><button class="name-btn" id="nm">${esc(S.name)}</button>.</h1>
   <p>${done?"Deine Runde für heute ist erledigt. Die Zeit gehört jetzt dir.":"Bevor du scrollst: drei Minuten für deinen Kopf?"}</p>
  </section>
  ${bonusOpen()?`<section class="card bonus stack pop">
   <span class="eyebrow">3 Tage am Stück</span><h2>Bonuslevel freigeschaltet: doppelte XP</h2>
   <button class="btn gold" id="bonus">Bonuslevel spielen</button></section>`:""}
  <section class="card stack">
   <div class="row"><span class="eyebrow">${done?"Erledigt":"Heutige Runde"}</span><span class="eyebrow">ca. 4 min</span></div>
   <div class="games">${ORDER.map(tag).join("")}</div>
   <button class="btn ${done?"ghost":""}" id="go">${done?"Freie Runde spielen":"Runde starten"}</button>
  </section>
  <section class="card stack">
   <div class="row"><b style="font-family:var(--display);font-weight:900">Bonuslevel</b><span class="eyebrow">${bLabel}</span></div>
   <div class="streak3">${[0,1,2].map(i=>`<span class="${i<cycle?"on":""}"></span>`).join("")}</div>

/* ---------- Runde ---------- */
function pickFresh(list,key,n,r,keep){
  const seen=(S.seen&&S.seen[key])||[];
  let pool=shuffle(list.map((_,i)=>i),r);
  if(keep){const f=pool.filter(i=>keep(list[i]));if(f.length>=n)pool=f.concat(pool.filter(i=>!keep(list[i])).slice(0,0))}
  return pool.filter(i=>!seen.includes(i)).concat(pool.filter(i=>seen.includes(i))).slice(0,n);
}
function markSeen(key,ids,max){S.seen=S.seen||{};S.seen[key]=(S.seen[key]||[]).filter(i=>!ids.includes(i)).concat(ids).slice(-max)}
const flag=iso=>iso.toUpperCase().replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt(0)));
function geoOpts(idx,field,r){
  const g=GEO[idx],n=LV().opts-1,easy=S.level==="leicht";
  const others=GEO.filter((x,i)=>i!==idx);
  const tiers=[others.filter(x=>x[3]===g[3]&&(!easy||EASY.has(x[0]))),others.filter(x=>x[3]===g[3]),others.filter(x=>!easy||EASY.has(x[0])),others];
  const picked=[];for(const t of tiers){for(const x of shuffle(t,r)){if(picked.length>=n)break;if(!picked.includes(x))picked.push(x)}}
  return shuffle([g[field],...picked.map(x=>x[field])],r);
}
function start(mode){

  const r=rng(mode==="daily"?today():today()+mode+Math.random());

  const gi=pickFresh(GEO,"geo",2,r,keepGeo),ci=pickFresh(CLUES,"clue",1,r);
  const geo=gi.map((idx,j)=>{const [c,cap,iso,cont,f]=GEO[idx];
    return j===0?{type:"cap",c,cap,cont,f,opts:geoOpts(idx,1,r)}:{type:"flag",c,iso,cont,f,opts:geoOpts(idx,0,r)}});
  ci.forEach(k=>{const [cat,hint,land]=CLUES[k],idx=GEO.findIndex(g=>g[0]===land),g=GEO[idx];
    geo.push({type:"clue",cat,hint,c:land,cont:g[3],f:g[4],opts:geoOpts(idx,0,r)})});
  const wi=[],cats=new Set();
  for(const i of pickFresh(WISSEN,"wis",WISSEN.length,r)){if(wi.length>=3)break;if(!cats.has(WISSEN[i][0])){cats.add(WISSEN[i][0]);wi.push(i)}}
  const wis=wi.map(i=>{const [cat,q,a,w,f]=WISSEN[i];return{cat,q,a,f,opts:shuffle([a,...shuffle(w,r).slice(0,LV().opts-1)],r)}});
  const fi=pickFresh(FERMI,"fer",2,r),fer=fi.map(i=>FERMI[i]);
  const math=Array.from({length:4},()=>{
    let a,b,op,ans;const t=Math.floor(r()*3);
    const L=S.level||"mittel",R_=(lo,hi)=>lo+Math.floor(r()*(hi-lo+1));
    if(t===0){[a,b]=L==="leicht"?[R_(5,40),R_(5,40)]:L==="schwer"?[R_(60,259),R_(40,199)]:[R_(12,89),R_(11,88)];op="+";ans=a+b}
    else if(t===1){a=L==="leicht"?R_(20,60):L==="schwer"?R_(120,319):R_(40,99);b=L==="leicht"?R_(3,a-5):L==="schwer"?R_(20,a-30):R_(7,a-4);op="−";ans=a-b}
    else{[a,b]=L==="leicht"?[R_(2,9),R_(2,9)]:L==="schwer"?[R_(6,19),R_(6,15)]:[R_(3,12),R_(4,12)];op="×";ans=a*b}
    const set=new Set([ans]);for(const x of shuffle([1,2,10,-1,-2,-10,9,11],r)){if(set.size>=4)break;if(ans+x>0)set.add(ans+x)}
    return{txt:`${a} ${op} ${b}`,ans,opts:shuffle([...set],r)}});
  R={mode,mult:mode==="bonus"?2:1,stage:0,i:0,geo,wis,fer,math,sud:makeSudoku(r),xp:0,correct:0,total:13,learnedNow:[],ids:{geo:gi,clue:ci,wis:wi,fer:fi}};
  next();
}

function makeSudoku(r){

  let g=base.map(row=>row.map(v=>dig[v-1]));
  if(r()<.5)[g[0],g[1]]=[g[1],g[0]];if(r()<.5)[g[2],g[3]]=[g[3],g[2]];if(r()<.5)g=[g[2],g[3],g[0],g[1]];
  if(r()<.5)g=g[0].map((_,c)=>g.map(row=>row[c]));
  const sol=g.flat(),holes=shuffle([...Array(16).keys()],r).slice(0,LV().holes);
  return{sol,cur:sol.map((v,i)=>holes.includes(i)?0:v),given:sol.map((_,i)=>!holes.includes(i)),sel:holes[0],mist:0,err:null};

  <p class="eyebrow" style="text-align:center;margin:0">Fehler: ${z.mist}</p>`;
  app.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{const i=+c.dataset.i;if(!z.given[i]){z.sel=i;sudQ()}});
  app.querySelectorAll(".pad button").forEach(b=>b.onclick=()=>{
    const n=+b.dataset.n,i=z.sel;if(i==null||z.given[i])return;
    z.cur[i]=n;z.err=null;
    if(n&&clash(z.cur,i)){z.mist++;z.err=i;sudQ();return}
    if(n){const nx=z.cur.findIndex((v,k)=>!v&&!z.given[k]);if(nx>=0)z.sel=nx}
    if(z.cur.every((v,k)=>v&&!clash(z.cur,k))){award(Math.max(20,60-z.mist*10));R.correct++;R.learnedNow.push(["sudoku",`Sudoku gelöst${z.mist?` mit ${z.mist} Fehler${z.mist>1?"n":""}`:" ohne Fehler"}`]);finish();return}
    sudQ();
  });
}

/* ---------- Ergebnis ---------- */
function finish(){
  if(S.example)S={name:S.name,xp:0,streak:0,last:null,learned:[],rounds:0,facts:0,bonusDay:null,bonusDone:null,level:S.level,friends:S.friends,seen:S.seen};
  const before=levelOf(S.xp).lvl;let unlocked=false;
  if(R.mode==="daily"){
    S.streak=(S.last===yesterday())?S.streak+1:1;S.last=today();
    if(S.streak%3===0){S.bonusDay=today();unlocked=true}
  }
  if(R.mode==="bonus")S.bonusDone=today();
  S.xp+=R.xp;S.rounds++;S.facts+=R.learnedNow.filter(x=>x[0]!=="sudoku").length;
  R.geo.forEach(q=>{if(!S.learned.includes(q.c))S.learned.push(q.c)});
  markSeen("geo",R.ids.geo,120);markSeen("clue",R.ids.clue,60);markSeen("wis",R.ids.wis,110);markSeen("fer",R.ids.fer,30);
  save();
  const L=levelOf(S.xp),up=L.lvl>before;
  const title=R.mode==="bonus"?"Bonuslevel geschafft":R.mode==="free"?"Freie Runde geschafft":"Runde geschafft";
  app.innerHTML=`<section class="card stack pop">
   <span class="eyebrow">${title} · ${R.correct} von ${R.total} richtig</span>
   <h1 style="font-size:40px">Stark, ${esc(S.name)}.</h1>
   <div><div class="xp-big">+${R.xp} XP</div>${R.mult>1?'<p style="margin:6px 0 0;font-weight:700">Doppelte XP durch den Bonus.</p>':""}${up?`<p style="margin:6px 0 0;font-weight:700">Level ${L.lvl} erreicht!</p>`:""}</div>
   ${R.mode==="daily"?`<div class="chip" style="align-self:flex-start;background:#FFF3CC">🔥 ${S.streak} ${S.streak===1?"Tag":"Tage"} in Folge</div>`:""}
  </section>
  ${unlocked?`<section class="card bonus stack pop"><span class="eyebrow">3 Tage am Stück</span><h2>Bonuslevel freigeschaltet: doppelte XP</h2><button class="btn gold" id="bonus">Jetzt spielen</button></section>`:""}
  <section class="card stack">
   <span class="eyebrow">Das hast du heute gelernt</span>
   <ul class="learned">${R.learnedNow.map(([k,t])=>`<li><i style="background:${GAMES[k].c}"></i>${esc(t)}</li>`).join("")}</ul>
  </section>
  <p style="margin:0;color:var(--muted);font-weight:600">Wenn du jetzt doch noch Instagram öffnest: völlig okay. Die besten drei Minuten hast du schon gehabt.</p>
  <button class="btn" id="hm">Fertig</button>`;
  $("#hm").onclick=home;
  if(unlocked)$("#bonus").onclick=()=>start("bonus");
}
intro();
</script>
